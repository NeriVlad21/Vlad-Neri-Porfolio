<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#152a4f"/>
      <stop offset="56%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </radialGradient>
    <radialGradient id="badgeRimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#4e89e8" stop-opacity="0"/>
      <stop offset="93%" stop-color="#5b93f0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7fb0ff" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="domeMetal" x1="18%" y1="15%" x2="86%" y2="88%">
      <stop offset="0%" stop-color="#f7fafe"/>
      <stop offset="52%" stop-color="#d2dbe9"/>
      <stop offset="100%" stop-color="#8b9ab0"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e89e8"/>
      <stop offset="100%" stop-color="#21488a"/>
    </linearGradient>
    <radialGradient id="eyeLens" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e3f3ff"/>
      <stop offset="44%" stop-color="#5292f2"/>
      <stop offset="100%" stop-color="#0a162b"/>
    </radialGradient>
    <linearGradient id="lowerBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6d2e3"/>
      <stop offset="50%" stop-color="#f5f8fd"/>
      <stop offset="100%" stop-color="#b8c5d8"/>
    </linearGradient>
  </defs>

  <!-- Dark navy circular badge with subtle inner glow and thin blue ring -->
  <circle cx="32" cy="32" r="29" fill="url(#badgeBg)"/>
  <circle cx="32" cy="32" r="28" fill="url(#badgeRimGlow)"/>
  <circle cx="32" cy="32" r="29" stroke="#5b8de0" stroke-width="2"/>

  <!-- Silver-white astromech dome head -->
  <path d="M10.5 40.5 A21.5 21.5 0 0 1 53.5 40.5 Z" fill="url(#domeMetal)" stroke="#5b6b84" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Blue dome panel sections -->
  <path d="M21 22.1 A21.5 21.5 0 0 1 43 22.1 L39.5 29.8 H24.5 Z" fill="url(#panelBlue)"/>
  <rect x="14.2" y="33.2" width="7.6" height="5" rx="1.4" fill="url(#panelBlue)"/>
  <rect x="42.2" y="33.2" width="7.6" height="5" rx="1.4" fill="url(#panelBlue)"/>
  <rect x="23.6" y="34.2" width="16.8" height="4" rx="1.4" fill="#1d3f7c"/>

  <!-- Small red sensor dot -->
  <circle cx="37.6" cy="36.2" r="2.1" fill="#e54858"/>

  <!-- Center glowing blue camera eye -->
  <rect x="25.2" y="23.6" width="13.6" height="9.8" rx="3" fill="#0d1729" stroke="#6b9ff0" stroke-width="1.4"/>
  <circle cx="32" cy="28.5" r="3.9" fill="url(#eyeLens)"/>
  <circle cx="33.3" cy="27.2" r="1.35" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Small white-and-blue bar below dome -->
  <rect x="16" y="43.8" width="32" height="6.8" rx="3.4" fill="url(#lowerBar)" stroke="#5b6b84" stroke-width="1.1"/>
  <rect x="21.5" y="45.9" width="21" height="2.6" rx="1.3" fill="#2d63bd"/>
</svg>
