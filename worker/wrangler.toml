name = "vlad-r2d2-chat"
main = "chat-worker.js"
compatibility_date = "2026-01-01"

# Plain environment variables (safe to commit).
# DO NOT put GROQ_API_KEY here — add it as an encrypted Cloudflare Secret:
#   wrangler secret put GROQ_API_KEY
[vars]
ALLOWED_ORIGINS = "https://vladneri.mereziko.workers.dev,http://localhost:3000"
MODEL = "llama-3.3-70b-versatile"
MAX_TOKENS = "180"

# Optional Cloudflare KV namespace for shared global rate limiting (15 req/min/IP).
# Without this binding, the Worker falls back to a per-isolate in-memory Map.
# To enable:
#   1. Run: wrangler kv namespace create RATE_LIMIT
#   2. Uncomment the block below and replace YOUR_KV_NAMESPACE_ID with the returned id.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "YOUR_KV_NAMESPACE_ID"
